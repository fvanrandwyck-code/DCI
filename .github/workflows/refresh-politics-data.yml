name: Refresh Politics data

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours — see build-politics-data.mjs / project notes
  workflow_dispatch: {}      # manual "Run workflow" button, for on-demand refresh/testing

permissions:
  contents: write            # needed to commit the refreshed data file back to the repo

concurrency:
  group: parliament-data-refresh  # shared with refresh-bills-data.yml so the two
                                   # queue rather than race when pushing to main
  cancel-in-progress: false  # let an in-flight run finish rather than racing a new one

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Politics data
        run: node scripts/build-politics-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/politics-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh Politics data [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push
          fi
